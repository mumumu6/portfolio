name: Verify site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - run: pnpm ci
      - run: pnpm build:ci
